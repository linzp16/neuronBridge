name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-source:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install build and test tools
        run: >-
          python -m pip install
          "pybind11>=2.12" "scikit-build-core>=0.10" wheel
          "pytest>=8" "numpy>=2.0" "matplotlib>=3.7" "pandas>=2.0" "pyzmq>=27"
      - name: Check release metadata
        run: python scripts/check_release_metadata.py
      - name: Verify dependency archive
        shell: powershell
        run: .\scripts\verify_dependencies.ps1 -Mode Archive
      - name: Validate generator and source Python API
        shell: powershell
        run: |
          python -m compileall -q python/src scripts tools/model_codegen examples/python
          python -m unittest discover -s tools/model_codegen/tests -p "test_*.py" -v
          $env:PYTHONPATH = (Resolve-Path python/src).Path
          python -m pytest -q python/tests/test_api.py `
            -k "input_conv_protocol or weight_and_outer_dynamic"
      - name: Parse PowerShell release entry points
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) { $errors; exit 1 }

  linux-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install source validation tools
        run: >-
          python -m pip install
          "pytest>=8" "numpy>=2.0,<3.0" "matplotlib>=3.9"
          "contourpy>=1.3" "pandas>=2.0" "pyzmq>=27"
      - name: Validate platform-independent Python and release tools
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
        run: |
          python -m compileall -q python/src scripts tools/model_codegen examples/python
          python -m unittest discover -s tools/model_codegen/tests -p "test_*.py" -v
          python -m pytest -q tests/release/test_release_tools.py python/tests/test_api.py
      - name: Validate Linux build entry point
        run: |
          bash -n scripts/build_neuronbridge_wheel.sh
          python scripts/check_include_case.py
