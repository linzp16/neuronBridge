[build-system]
requires = ["scikit-build-core>=0.10", "setuptools-scm>=8", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "neuronbridge"
version = "0.1.0a0"
description = "Python interface for the NeuronBridge neural simulation runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.7",
  "pandas>=2.0",
]

[project.optional-dependencies]
communication = [
  "pyzmq>=27",
]
dev = [
  "pytest>=8",
  "pyzmq>=27",
]

[tool.scikit-build]
cmake.source-dir = ".."
build.targets = ["neuronbridge_python_core"]
wheel.packages = ["src/neuronbridge"]
install.components = ["Unspecified"]
wheel.exclude = [
  "neuronbridge/__pycache__/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
