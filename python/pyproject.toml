[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "neuronbridge"
version = "0.1.0a0"
description = "Python interface for the NeuronBridge neural simulation runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
]
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.7",
  "pandas>=2.0",
]

[project.optional-dependencies]
communication = [
  "pyzmq>=27",
]
dev = [
  "pytest>=8",
  "pyzmq>=27",
  "delvewheel>=1.9",
  "build>=1.2",
]

[tool.scikit-build]
cmake.source-dir = ".."
build.targets = ["neuronbridge_python_core"]
wheel.packages = ["src/neuronbridge"]
install.components = ["Unspecified"]
wheel.exclude = [
  "neuronbridge/__pycache__/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
